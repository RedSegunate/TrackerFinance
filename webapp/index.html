<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Tracker Finance</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/design-system.css" />
  <style>
    /* Только то, чего нет в дизайн-системе: вход для разработки и мелочи экранов */
    [hidden] { display: none !important; }
    .swipe-wrap + .swipe-wrap > .row { border-top: 1px solid var(--line); }
    .swipe-act { border: 0; cursor: pointer; }
    .login { min-height: 80vh; align-content: center; gap: var(--sp-3); }
    .login.on { display: grid; }
    .err { color: var(--expense); font-size: var(--fs-small); min-height: 18px; }
    .swipe-wrap .row { touch-action: pan-y; }
    .field { display: grid; gap: 6px; margin-top: var(--sp-3); }
    .field > label { color: var(--hint); font-size: var(--fs-small); font-weight: 600; }
    select.input { appearance: none; }
    .acts-row { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }
    .acts-row .btn { flex: 1; }
    .sheet h2 { margin: 4px 2px 12px; }
    .row .main span.sub-ok { color: var(--hint); }
    .chat-intro { display: grid; gap: 6px; }
    .composer[aria-disabled="true"] { opacity: .5; pointer-events: none; }
    #ai-bottom { height: 1px; }
  </style>
</head>
<body>
  <main class="app" id="app">
    <!-- Вход для разработки (в Telegram не показывается) -->
    <section id="login" class="login screen">
      <h1>Tracker Finance</h1>
      <p class="muted">Откройте приложение из Telegram: кнопка «Приложение» в боте или меню слева от поля ввода.</p>
      <input class="input" id="dev-token" placeholder="Ключ из /token" autocomplete="off" />
      <button class="btn primary block" id="dev-enter">Войти</button>
      <p class="err" id="login-err"></p>
    </section>

    <section id="sc-home" class="screen"></section>

    <section id="sc-history" class="screen">
      <div class="topbar"><div class="title"><span class="eyebrow">Журнал</span><h1>Операции</h1></div></div>
      <label class="search"><span aria-hidden="true">🔍</span><input id="history-search" type="search" placeholder="Название, категория или сумма" autocomplete="off" /></label>
      <div class="chips" id="history-chips" style="margin:10px 0 4px">
        <button class="chip on" data-kind="all">Все</button>
        <button class="chip" data-kind="expense">Расходы</button>
        <button class="chip" data-kind="income">Доходы</button>
        <button class="chip" id="history-cat" data-act="pick-category">🏷 Категория ▾</button>
      </div>
      <div class="muted" style="margin:6px 2px">Свайп влево по записи — удалить, нажатие — изменить</div>
      <div class="card flush list" id="tx-list"></div>
      <div id="tx-more"></div>
    </section>

    <section id="sc-stats" class="screen"></section>
    <section id="sc-plans" class="screen"></section>

    <section id="sc-ai" class="screen">
      <div class="topbar"><div class="title"><span class="eyebrow">ИИ</span><h1>Советник</h1></div></div>
      <div class="chat" id="chat"></div>
      <div class="chips" id="ai-chips" style="margin:12px 0 0">
        <button class="chip" data-ask="Куда уходят деньги?">Куда уходят деньги?</button>
        <button class="chip" data-ask="Хватит ли мне до конца месяца?">Хватит до конца месяца?</button>
        <button class="chip" data-ask="Как накопить на цель?">Как накопить на цель?</button>
      </div>
      <form class="composer" id="composer" style="margin-top:10px">
        <input id="ai-in" maxlength="500" placeholder="Спросите про свои траты…" autocomplete="off" />
        <button class="send" type="submit" aria-label="Отправить">↑</button>
      </form>
      <div id="ai-bottom"></div>
    </section>

    <section id="sc-settings" class="screen"></section>
  </main>

  <nav class="tabbar" id="tabbar" hidden></nav>
  <div class="overlay" id="overlay"></div>
  <div id="toast-host"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
